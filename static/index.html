<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>emotion healer</title>
<style>
  :root {
    --bg: #faf8f5;
    --fg: #2c2723;
    --muted: #8a8079;
    --line: #e7e1da;
    --mine: #efe9e1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171513;
      --fg: #e8e3dd;
      --muted: #8a8079;
      --line: #2c2723;
      --mine: #26221f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 42rem;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 1.5rem 1.25rem 0;
  }
  #log { flex: 1; display: flex; flex-direction: column; gap: 1.25rem; }
  .empty { color: var(--muted); margin: auto 0; text-align: center; }
  .turn { white-space: pre-wrap; overflow-wrap: anywhere; }
  .turn.mine {
    align-self: flex-end;
    max-width: 85%;
    background: var(--mine);
    padding: 0.7rem 1rem;
    border-radius: 1rem 1rem 0.2rem 1rem;
  }
  .turn.err { color: #c0574a; font-size: 0.875rem; }
  form {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    border-top: 1px solid var(--line);
    display: flex;
    gap: 0.75rem;
    align-items: flex-end;
    padding: 0.9rem 0 1.2rem;
    margin-top: 1.5rem;
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--line);
    border-radius: 0.9rem;
    background: transparent;
    color: inherit;
    font: inherit;
    padding: 0.7rem 0.9rem;
    max-height: 9rem;
  }
  textarea:focus { outline: 2px solid var(--muted); outline-offset: 1px; }
  button {
    border: 0;
    border-radius: 0.9rem;
    background: var(--fg);
    color: var(--bg);
    font: inherit;
    padding: 0.7rem 1.1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<main>
  <div id="log">
    <p class="empty">지금 드는 생각을 그대로 적어보세요.<br />정리하지 않아도 괜찮습니다.</p>
  </div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="…" autofocus></textarea>
    <button id="send" type="submit">보내기</button>
  </form>
</main>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const threadId = crypto.randomUUID();

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  function addTurn(cls, text = "") {
    log.querySelector(".empty")?.remove();
    const el = document.createElement("div");
    el.className = "turn " + cls;
    el.textContent = text;
    log.append(el);
    el.scrollIntoView({ block: "end" });
    return el;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    addTurn("mine", message);
    input.value = "";
    input.style.height = "auto";
    send.disabled = true;

    const reply = addTurn("theirs");
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, thread_id: threadId }),
      });

      // EventSource는 POST를 못 해서 body를 직접 읽는다
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const frames = buffer.split("\n\n");
        buffer = frames.pop();
        for (const frame of frames) {
          if (!frame.startsWith("data: ")) continue;
          const payload = JSON.parse(frame.slice(6));
          if (payload.text) {
            reply.textContent += payload.text;
            reply.scrollIntoView({ block: "end" });
          } else if (payload.error) {
            reply.className = "turn err";
            reply.textContent = payload.error;
          }
        }
      }
    } catch (err) {
      reply.className = "turn err";
      reply.textContent = String(err);
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
